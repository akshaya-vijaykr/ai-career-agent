<!DOCTYPE html>
<html>
<body>

<h2>AI Career Agent</h2>

<form id="form">
  <label>Upload Job Description (PDF):</label><br>
  <input type="file" id="jd" required><br><br>

  <label>Upload Resume (PDF):</label><br>
  <input type="file" id="resume" required><br><br>

  <button type="submit">Analyze</button>
</form>

<hr>

<pre id="output" style="white-space: pre-wrap;"></pre>

<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();

  const jd = document.getElementById('jd').files[0];
  const resume = document.getElementById('resume').files[0];

  const formData = new FormData();
  formData.append("jd", jd);
  formData.append("resume", resume);

  const res = await fetch("http://localhost:5678/webhook-test/career-agent", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  let output = "";

  // QUESTIONS
  output += "=== QUESTIONS ===\n";
  data.questions?.forEach((q, i) => {
    output += `${i + 1}. ${q}\n`;
  });

  // SIMULATED ANSWERS
  output += "\n=== SIMULATED ANSWERS ===\n";
  data.simulated_answers?.forEach((a, i) => {
    output += `${i + 1}. ${a}\n`;
  });

  // EVALUATION
  output += "\n=== EVALUATION ===\n";
  output += `Score: ${data.evaluation?.score}\n`;
  output += `Level: ${data.evaluation?.level}\n`;

  // LEARNING PLAN WITH TIME
  output += "\n=== LEARNING PLAN ===\n";
  data.learning_plan?.forEach((item) => {
    output += `\nSkill: ${item.skill}\n`;
    output += `Plan: ${item.plan}\n`;
    output += `Time Estimate: ${item.time_estimate}\n`;
    output += `Resources: ${item.resources.join(", ")}\n`;
  });

  document.getElementById("output").innerText = output;
};
</script>

</body>
</html>
